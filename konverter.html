<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Arab -> Római Konverter</title>
    <link rel="stylesheet" href="https://unpkg.com/qunit@3.0.0-alpha.4/qunit/qunit.css">
</head>

<body>

<div id="qunit"></div>
<div id="qunit-fixture"></div>

<script src="https://unpkg.com/qunit@3.0.0-alpha.4/qunit/qunit.js"></script>

<script>

    function convertToRoman(num) {
        if (typeof num !== "number" || num <= 0) return "";

        const lookup = {
            M: 1000, CM: 900, D: 500, CD: 400,
            C: 100,  XC: 90,  L: 50,  XL: 40,
            X: 10,   IX: 9,   V: 5,   IV: 4,
            I: 1
        };

        let roman = "";
        for (let key in lookup) {
            while (num >= lookup[key]) {
                roman += key;
                num -= lookup[key];
            }
        }

        return roman;
    }

    QUnit.module("Arab -> Római konverter tesztelése");

    QUnit.test("Alapvető számok (1 -> 'I', 2 -> 'II', 3 -> 'III')", function(assert) {
        assert.equal(convertToRoman(1), "I");
        assert.equal(convertToRoman(2), "II");
        assert.equal(convertToRoman(3), "III");
    });

    QUnit.test("Kivonásos szabályok (4 -> 'IV', 9 -> 'IX')", function(assert) {
        assert.equal(convertToRoman(4), "IV");
        assert.equal(convertToRoman(9), "IX");
    });

    QUnit.test("Összetett római számok", function(assert) {
        assert.equal(convertToRoman(58), "LVIII");
        assert.equal(convertToRoman(1994), "MCMXCIV");
        assert.equal(convertToRoman(3999), "MMMCMXCIX");
    });

    QUnit.test("Érvénytelen és határesetek kezelése", function(assert) {
        assert.equal(convertToRoman(0), "");
        assert.equal(convertToRoman(-5), "");
        assert.equal(convertToRoman("10"), "");
    });

</script>

</body>
</html>
